services:
  - type: web
    name: enterprise-dfir
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT src.app:app
    autoDeploy: true

    disk:
      name: enterprise-dfir-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: APP_ENV
        value: production

      - key: DB_PATH
        value: /var/data/dfir.db

      - key: UPLOAD_FOLDER
        value: /var/data/uploads

      - key: SECRET_KEY
        generateValue: true